# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# MANUAL TRIGGER ONLY (workflow_dispatch).
#
# This deliberately does NOT deploy on push. The participant study is live at
# mls-from-whitechapel.fly.dev and winding down; an accidental deploy mid-session
# would drop in-memory game state (server/session.py keeps sessions in RAM).
#
# The previous trigger was `push: branches: [main]`, but this repo only has
# `master` and `dev`, so the workflow had never once fired. Deploys to date were
# manual `fly deploy` runs from a working directory.
#
# To deploy: GitHub -> Actions -> "Fly Deploy" -> Run workflow.
name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
