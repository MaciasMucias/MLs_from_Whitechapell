# fly.toml app configuration file generated for mls-from-whitechapel on 2026-05-30T18:19:44+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mls-from-whitechapel'
primary_region = 'fra'

[build]

[[mounts]]
  source = 'replay_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
